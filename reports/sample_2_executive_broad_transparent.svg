<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  
  <g id="executive_broad_perfect">
    <!-- 1. SOLID FACET FILLS (Seamless underlying mesh, no stroke clipping) -->
    <g id="facet_fills">
      <!-- Central Top Spire -->
      <polygon points="500,210 364.3,431.2 500,505 635.7,431.2" fill="#0B192C"/>
      <!-- Upper Left Wing (Exact reflection of Right Wing) -->
      <polygon points="500,210 270,380 364.3,431.2" fill="#0B192C"/>
      <!-- Upper Right Wing -->
      <polygon points="500,210 730,380 635.7,431.2" fill="#0B192C"/>
      <!-- Lower Left Flank (Exact reflection of Right Flank) -->
      <polygon points="270,380 270,585 500,505 364.3,431.2" fill="#0B192C"/>
      <!-- Lower Right Flank -->
      <polygon points="730,380 730,585 500,505 635.7,431.2" fill="#0B192C"/>
      <!-- Left Amber Blade with diamond notch -->
      <path d="M 500,505 L 270,585 L 500,810 L 500,627 L 491,615 L 500,603 L 500,505 Z" fill="#F59E0B"/>
      <!-- Right Amber Blade with diamond notch -->
      <path d="M 500,505 L 730,585 L 500,810 L 500,627 L 509,615 L 500,603 L 500,505 Z" fill="#E08A00"/>
    </g>

    <!-- 2. UNIFORM ARCHITECTURAL LINES (Drawn on top with exact 7px width & mathematical symmetry) -->
    <g id="facet_lines" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <!-- Diamond Breather Hole Cutout -->
      <polygon points="500,603 509,615 500,627 491,615" fill="transparent" stroke="none"/>
      
      <!-- Central Spire Diagonals (Left & Right exact mirror) -->
      <line x1="500" y1="210" x2="364.3" y2="431.2"/>
      <line x1="500" y1="210" x2="635.7" y2="431.2"/>
      
      <!-- Wing to Flank Dividers (Left & Right exact mirror) -->
      <line x1="270" y1="380" x2="364.3" y2="431.2"/>
      <line x1="730" y1="380" x2="635.7" y2="431.2"/>
      
      <!-- Flank to Spire Dividers (Left & Right exact mirror) -->
      <line x1="364.3" y1="431.2" x2="500" y2="505"/>
      <line x1="635.7" y1="431.2" x2="500" y2="505"/>
      
      <!-- Navy Flank to Amber Blade Dividers (Left & Right exact mirror) -->
      <line x1="270" y1="585" x2="500" y2="505"/>
      <line x1="730" y1="585" x2="500" y2="505"/>
      
      <!-- Vertical Slit: Upper section & Lower section to nib tip -->
      <line x1="500" y1="505" x2="500" y2="603"/>
      <line x1="500" y1="627" x2="500" y2="810" stroke-linecap="square"/>
    </g>

    <!-- 3. OPTIONAL OUTER FRAME FOR DARK VARIANTS -->
    
  </g>
</svg>