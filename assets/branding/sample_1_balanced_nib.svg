<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- 60% White Canvas -->
  <rect width="1000" height="1000" fill="#FFFFFF"/>
  <g id="sample_1_balanced_nib">
    <!-- 30% DEEP NAVY: GEOMETRIC DIAMOND PRISM FACETS -->
    <!-- 1. Central Top Rhombus/Spire -->
    <polygon points="500,210 388.2,433.5 500,510 611.8,433.5" 
             fill="#0B192C" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- 2. Upper Left Wing -->
    <polygon points="500,210 310,380 388.2,433.5" 
             fill="#0B192C" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- 3. Upper Right Wing -->
    <polygon points="500,210 611.8,433.5 690,380" 
             fill="#0B192C" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- 4. Lower Left Flank -->
    <polygon points="310,380 310,590 500,510 388.2,433.5" 
             fill="#0B192C" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- 5. Lower Right Flank -->
    <polygon points="690,380 611.8,433.5 500,510 690,590" 
             fill="#0B192C" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- 10% WARM AMBER: SOLID FOUNTAIN PEN NIB WITH BREATH & SLIT -->
    <!-- Left Amber Blade -->
    <path d="M 500,510 
             L 310,590 
             L 500,810 
             L 500,653 
             A 23 23 0 0 1 500,607 
             L 500,510 Z" 
          fill="#F59E0B" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- Right Amber Blade -->
    <path d="M 500,510 
             L 500,607 
             A 23 23 0 0 1 500,653 
             L 500,810 
             L 690,590 
             L 500,510 Z" 
          fill="#E08A00" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- Breather Hole Ring (Clean Negative Space #FFFFFF) -->
    <circle cx="500" cy="630" r="23" fill="#FFFFFF"/>
    
    <!-- Cryptographic Verification Node (Deep Navy #0B192C) -->
    <circle cx="500" cy="630" r="9" fill="#0B192C"/>

    <!-- Vertical Ink Slit (Strictly from Breather Hole to Nib Tip) -->
    <line x1="500" y1="653" x2="500" y2="810" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square"/>
  </g>
</svg>