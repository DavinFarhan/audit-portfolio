<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 60% PUTIH BERSIH: Latar Belakang & Ruang Negatif Lapang -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- HIBRIDA PRISMA WEB3 + MATA PENA AUDITOR -->
  <g transform="translate(0, 0)">
    <!-- 30% DEEP NAVY: Faset Puncak & Sayap Geometris -->
    <!-- Faset Puncak Prisma -->
    <polygon points="256,50 314,125 256,168 198,125" fill="#0B192C"/>

    <!-- Sayap Kiri Prisma -->
    <polygon points="188,135 142,205 186,290 246,178" fill="#0B192C"/>

    <!-- Sayap Kanan Prisma -->
    <polygon points="324,135 370,205 326,290 266,178" fill="#0B192C"/>

    <!-- 10% EMERALD GREEN: Mata Pena Kaligrafi Berkembang di Bawah -->
    <!-- Bilah Kiri Ujung Pena -->
    <path d="M 252 195 
             L 220 290 
             C 205 325, 215 365, 252 465 
             L 252 308 
             C 244 305, 238 296, 238 285 
             C 238 273, 244 265, 252 262 
             Z" 
          fill="#10B981"/>

    <!-- Bilah Kanan Ujung Pena -->
    <path d="M 260 195 
             L 292 290 
             C 307 325, 297 365, 260 465 
             L 260 308 
             C 268 305, 274 296, 274 285 
             C 274 273, 268 265, 260 262 
             Z" 
          fill="#10B981"/>

    <!-- Lubang Nafas Pena / Node Kripto Terverifikasi -->
    <circle cx="256" cy="285" r="11" fill="#FFFFFF"/>
    <circle cx="256" cy="285" r="5" fill="#0B192C"/>
  </g>
</svg>
