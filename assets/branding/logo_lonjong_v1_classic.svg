<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 60% PUTIH BERSIH: Latar Belakang & Ruang Negatif Lapang -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- VARIASI 1: THE ELONGATED CLASSIC KITE (Lonjong Seimbang - Rasio 1 : 1.45) -->
  <g transform="translate(0, 0)">
    <!-- 30% DEEP NAVY: Faset Atas & Sayap Samping -->
    <!-- 1. Faset Atas Ramping -->
    <polygon points="256,65 316,145 256,188 196,145" fill="#0B192C"/>

    <!-- 2. Sayap Kiri Lonjong -->
    <polygon points="186,155 138,225 195,315 246,198" fill="#0B192C"/>

    <!-- 3. Sayap Kanan Lonjong -->
    <polygon points="326,155 374,225 317,315 266,198" fill="#0B192C"/>

    <!-- 10% EMERALD GREEN: Faset Bawah Meruncing Panjang -->
    <!-- 4. Ujung Mata Pena / Penegas Verifikasi -->
    <polygon points="256,208 296,315 256,440 216,315" fill="#10B981"/>

    <!-- Titik Inti Putih Bersih (Single Source of Truth) -->
    <circle cx="256" cy="275" r="10" fill="#FFFFFF"/>
  </g>
</svg>
