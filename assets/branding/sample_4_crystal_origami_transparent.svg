<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="none"/>
  <g id="sample4-crystal-origami">
    <!-- TOP SECTION: ETHEREUM CRYSTAL ORIGAMI (DEEP NAVY) -->
    <!-- Facet 1: Central Spire Left -->
    <polygon points="500,160 415,310 500,430" fill="#13233C" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Facet 2: Central Spire Right -->
    <polygon points="500,160 500,430 585,310" fill="#1A3052" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Facet 3: Upper Outer Left -->
    <polygon points="500,160 265,380 415,310" fill="#0B192C" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Facet 4: Upper Outer Right -->
    <polygon points="500,160 585,310 735,380" fill="#0E1F36" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Facet 5: Mid Wing Left -->
    <polygon points="265,380 290,530 425,465 415,310" fill="#081424" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Facet 6: Mid Wing Right -->
    <polygon points="735,380 585,310 575,465 710,530" fill="#162B4A" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Facet 7 & 8: Lower Keystones -->
    <polygon points="415,310 425,465 500,430" fill="#102138" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="585,310 500,430 575,465" fill="#1F365A" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- BOTTOM SECTION: DUAL-TONE AMBER NIB -->
    <!-- Left Blade -->
    <path d="M 495 434 
             L 286 534 
             L 495 840 
             L 495 590 
             A 25 25 0 0 1 495 540 
             L 495 434 Z" 
          fill="#F59E0B" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- Right Blade -->
    <path d="M 505 434 
             L 505 540 
             A 25 25 0 0 1 505 590 
             L 505 840 
             L 714 534 
             L 505 434 Z" 
          fill="#D97706" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- Breather Hole & Central Slit -->
    <circle cx="500" cy="565" r="25" fill="#FFFFFF"/>
    <circle cx="500" cy="565" r="10" fill="#0B192C"/>
    <line x1="500" y1="590" x2="500" y2="840" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square"/>
  </g>
</svg>