<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="none"/>
  <g id="stencil-aperture-nib">
    <!-- TOP SECTION: NAVY FACETS WITH INTERNAL APERTURES (BOLONG) -->
    <!-- Base Top Facets -->
    <polygon points="500,210 395,355 500,425 605,355" fill="#0B192C" stroke="#FFFFFF" stroke-width="6"/>
    <polygon points="500,210 270,380 395,355" fill="#0B192C" stroke="#FFFFFF" stroke-width="6"/>
    <polygon points="500,210 605,355 730,380" fill="#0B192C" stroke="#FFFFFF" stroke-width="6"/>
    <polygon points="270,380 270,585 500,505 395,355" fill="#0B192C" stroke="#FFFFFF" stroke-width="6"/>
    <polygon points="730,380 605,355 500,505 730,585" fill="#0B192C" stroke="#FFFFFF" stroke-width="6"/>

    <!-- Geometric Negative Space Windows (Bolong-bolong Putih) -->
    <!-- Top Window -->
    <polygon points="500,260 435,355 500,395 565,355" fill="#FFFFFF"/>
    <!-- Left Wing Window -->
    <polygon points="475,250 325,365 405,350" fill="#FFFFFF"/>
    <!-- Right Wing Window -->
    <polygon points="525,250 595,350 675,365" fill="#FFFFFF"/>
    <!-- Lower Left Window -->
    <polygon points="310,405 310,545 460,490 395,385" fill="#FFFFFF"/>
    <!-- Lower Right Window -->
    <polygon points="690,405 605,385 540,490 690,545" fill="#FFFFFF"/>

    <!-- Central Verification Node in Top Window -->
    <circle cx="500" cy="355" r="10" fill="#0B192C"/>

    <!-- BOTTOM SECTION: WARM AMBER NIB WITH APERTURES -->
    <!-- Left Amber Blade with cutout window -->
    <path d="M 500,505 L 270,585 L 500,810 L 500,651 A 26 26 0 0 1 500,599 L 500,505 Z" 
          fill="#F59E0B" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Right Amber Blade -->
    <path d="M 500,505 L 500,599 A 26 26 0 0 1 500,651 L 500,810 L 730,585 L 500,505 Z" 
          fill="#D97706" stroke="#FFFFFF" stroke-width="6"/>

    <!-- Windows inside the amber nib (bolong) -->
    <polygon points="460,535 320,585 460,730" fill="#FFFFFF"/>
    <polygon points="540,535 540,730 680,585" fill="#FFFFFF"/>

    <!-- Breather Hole & Central Slit -->
    <circle cx="500" cy="625" r="26" fill="#FFFFFF"/>
    <circle cx="500" cy="625" r="11" fill="#0B192C"/>
    <line x1="500" y1="651" x2="500" y2="810" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square"/>
  </g>
</svg>