<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">

    <!-- Latar Belakang -->
    <!-- 60% Pure White Canvas -->
    <rect width="1000" height="1000" fill="#FFFFFF"/>

    <g id="prism-origami-nib">
        <!-- TOP SECTION: ETHEREUM CRYSTAL ORIGAMI (DEEP NAVY) -->
        <!-- Facet Apex Kiri -->
        <polygon points="500,150 270,360 420,380" fill="#0B192C" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
        
        <!-- Facet Apex Tengah Kiri -->
        <polygon points="500,150 420,380 500,430" fill="#13233C" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
        
        <!-- Facet Apex Tengah Kanan -->
        <polygon points="500,150 500,430 580,380" fill="#1A3052" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
        
        <!-- Facet Apex Kanan Luar -->
        <polygon points="500,150 580,380 730,360" fill="#0E1F36" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
        
        <!-- Sayap Bawah Kiri -->
        <polygon points="270,360 300,520 440,460 420,380" fill="#081424" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
        
        <!-- Sayap Bawah Kanan -->
        <polygon points="730,360 580,380 560,460 700,520" fill="#162B4A" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
        
        <!-- Segitiga Pusat Penghubung -->
        <polygon points="420,380 440,460 500,480 500,430" fill="#112239" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
        <polygon points="580,380 500,430 500,480 560,460" fill="#1F365A" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>

        <!-- BOTTOM SECTION: MULTI-FACETED AMBER NIB -->
        <!-- Sayap Luar Kiri Amber -->
        <polygon points="300,520 440,460 380,590" fill="#FBBF24" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
        
        <!-- Sayap Luar Kanan Amber -->
        <polygon points="700,520 620,590 560,460" fill="#B45309" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>

        <!-- Bilah Inti Kiri Amber -->
        <path d="M 494 490 
                 L 435 465 
                 L 378 595 
                 L 494 850 
                 L 494 670 
                 A 24 24 0 0 1 494 622 
                 L 494 490 Z" 
              fill="#F59E0B" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>

        <!-- Bilah Inti Kanan Amber -->
        <path d="M 506 490 
                 L 506 622 
                 A 24 24 0 0 1 506 670 
                 L 506 850 
                 L 622 595 
                 L 565 465 
                 L 506 490 Z" 
              fill="#D97706" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>

        <!-- Breather Hole & Central Slit -->
        <circle cx="500" cy="646" r="24" fill="#FFFFFF"/>
        <circle cx="500" cy="646" r="10" fill="#0B192C"/>
        <line x1="500" y1="670" x2="500" y2="850" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square"/>
    </g>
    
</svg>