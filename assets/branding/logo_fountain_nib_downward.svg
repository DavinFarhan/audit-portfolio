<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 60% PUTIH BERSIH: Latar Belakang & Ruang Negatif Lapang -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- MATA PENA AUDITOR MODERN (FOUNTAIN PEN NIB - Menghadap ke Bawah / Sedang Meneliti) -->
  <g transform="translate(0, 0)">
    <!-- 30% DEEP NAVY: Pangkal & Pundak Pena (Fondasi Profesionalisme & Otoritas Riset) -->
    <!-- Bilah Kiri Pena -->
    <path d="M 252 65 
             L 190 65 
             C 180 120, 150 165, 140 220 
             C 130 270, 165 330, 252 455 
             L 252 284 
             C 238 281, 228 268, 228 252 
             C 228 236, 238 223, 252 220 
             Z" 
          fill="#0B192C"/>

    <!-- Bilah Kanan Pena -->
    <path d="M 260 65 
             L 322 65 
             C 332 120, 362 165, 372 220 
             C 382 270, 347 330, 260 455 
             L 260 284 
             C 274 281, 284 268, 284 252 
             C 284 236, 274 223, 260 220 
             Z" 
          fill="#0B192C"/>

    <!-- 10% EMERALD GREEN: Ujung Mata Pena / Penegas Tanda Tangan Verifikasi -->
    <!-- Ujung Kiri -->
    <path d="M 252 385 
             C 232 355, 205 325, 202 305 
             C 215 350, 240 405, 252 455 
             Z" 
          fill="#10B981"/>

    <!-- Ujung Kanan -->
    <path d="M 260 385 
             C 280 355, 307 325, 310 305 
             C 297 350, 272 405, 260 455 
             Z" 
          fill="#10B981"/>

    <!-- Lubang Nafas Pena / Node Kriptografis (Breather Hole) -->
    <circle cx="256" cy="252" r="16" fill="#FFFFFF"/>
    <!-- Cincin Node Kripto di Dalam Lubang Nafas -->
    <circle cx="256" cy="252" r="7" fill="#10B981"/>
  </g>
</svg>
