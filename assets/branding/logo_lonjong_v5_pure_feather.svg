    <!-- Bilah Kanan Atas -->
    <path d="M 261 45 L 261 228 C 272 234 280 245 282 258 L 337 258 L 292 150 Z" fill="#0B192C"/>

    <!-- 10% EMERALD GREEN: Bilah Panah Bawah Meruncing Tajam -->
