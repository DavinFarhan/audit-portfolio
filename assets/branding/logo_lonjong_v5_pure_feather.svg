    <path d="M 230 262 C 232 274 240 284 251 290 L 251 475 L 205 320 L 225 262 Z" fill="#10B981"/>
    <!-- Bilah Kanan Bawah -->
    <path d="M 282 262 C 280 274 272 284 261 290 L 261 475 L 307 320 L 287 262 Z" fill="#10B981"/>

    <!-- Titik Inti Putih Bersih (Single Source of Truth) -->
