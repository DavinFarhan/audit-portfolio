<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="#FFFFFF"/>
  <g id="broad-slender-wireframe">
    <!-- TOP SECTION: DEEP NAVY HOLLOW FACETS (16px stroke) -->
    <!-- 1. Puncak Atas -->
    <polygon points="500,160 590,290 500,380 410,290" 
             fill="none" stroke="#0B192C" stroke-width="16" stroke-linejoin="round"/>

    <!-- 2. Sayap Kiri -->
    <polygon points="390,300 270,390 350,540 430,420" 
             fill="none" stroke="#0B192C" stroke-width="16" stroke-linejoin="round"/>

    <!-- 3. Sayap Kanan -->
    <polygon points="610,300 730,390 650,540 570,420" 
             fill="none" stroke="#0B192C" stroke-width="16" stroke-linejoin="round"/>

    <!-- BOTTOM SECTION: WARM AMBER HOLLOW NIB (16px stroke) -->
    <polygon points="500,430 380,540 500,840 620,540" 
             fill="none" stroke="#F59E0B" stroke-width="16" stroke-linejoin="round"/>

    <!-- Central Vertical Slit -->
    <line x1="500" y1="620" x2="500" y2="840" stroke="#F59E0B" stroke-width="14" stroke-linecap="round"/>

    <!-- Breather Hole Ring -->
    <circle cx="500" cy="590" r="28" fill="#FFFFFF" stroke="#F59E0B" stroke-width="14"/>
    <!-- Center Node -->
    <circle cx="500" cy="590" r="11" fill="#0B192C"/>
  </g>
</svg>