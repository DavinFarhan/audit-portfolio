<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="none"/>
  <g id="option-b-crystalline-prism">
    <!-- TOP SECTION: ETHEREUM CRYSTAL ORIGAMI (DEEP NAVY) -->
    <!-- Central Spire Left -->
    <polygon points="500,160 410,320 500,410" fill="#142640" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    <!-- Central Spire Right -->
    <polygon points="500,160 500,410 590,320" fill="#1C3558" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Upper Left Wing -->
    <polygon points="500,160 260,370 410,320" fill="#0B192C" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    <!-- Upper Right Wing -->
    <polygon points="500,160 590,320 740,370" fill="#0E2038" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Mid Flank Left -->
    <polygon points="260,370 270,525 410,445 410,320" fill="#081424" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    <!-- Mid Flank Right -->
    <polygon points="740,370 590,320 590,445 730,525" fill="#182E4E" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Lower Infill Left & Right -->
    <polygon points="410,320 500,410 410,445" fill="#10223A" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="590,320 410,445 500,410" fill="none"/>
    <polygon points="590,320 590,445 500,410" fill="#1F365A" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- BOTTOM SECTION: BROAD WARM AMBER NIB -->
    <path d="M 500 422 
             L 266 535 
             L 497 840 
             L 497 580 
             A 26 26 0 0 1 497 528 
             L 497 422 Z" 
          fill="#F59E0B" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <path d="M 500 422 
             L 503 422 
             L 503 528 
             A 26 26 0 0 1 503 580 
             L 503 840 
             L 734 535 Z" 
          fill="#D97706" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- Breather Hole & Central Slit -->
    <circle cx="500" cy="554" r="26" fill="#FFFFFF"/>
    <circle cx="500" cy="554" r="11" fill="#0B192C"/>
    <line x1="500" y1="580" x2="500" y2="840" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square"/>
  </g>
</svg>