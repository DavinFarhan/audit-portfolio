<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="#FFFFFF"/>
  <g id="sample3-hex-shield">
    <!-- TOP SECTION: HEXAGONAL PRISM SHIELD -->
    <!-- Top Central Triangle -->
    <polygon points="500,170 375,275 500,360 625,275" fill="#142642" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Top Left Shoulder -->
    <polygon points="500,170 235,335 375,275" fill="#0B192C" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Top Right Shoulder -->
    <polygon points="500,170 625,275 765,335" fill="#0D2039" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Left Hex Wall -->
    <polygon points="235,335 250,520 395,445 375,275" fill="#091626" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Right Hex Wall -->
    <polygon points="765,335 625,275 605,445 750,520" fill="#182E4E" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Center Infill -->
    <polygon points="375,275 500,360 500,420 395,445" fill="#10223A" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    <polygon points="625,275 605,445 500,420 500,360" fill="#1C3456" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>

    <!-- BOTTOM SECTION: WIDE-SHOULDERED AMBER NIB -->
    <!-- Left Blade -->
    <path d="M 495 424 
             L 246 524 
             L 495 840 
             L 495 585 
             A 25 25 0 0 1 495 535 
             L 495 424 Z" 
          fill="#F59E0B" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- Right Blade -->
    <path d="M 505 424 
             L 505 535 
             A 25 25 0 0 1 505 585 
             L 505 840 
             L 754 524 
             L 505 424 Z" 
          fill="#D97706" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- Breather Hole & Central Slit -->
    <circle cx="500" cy="560" r="25" fill="#FFFFFF"/>
    <circle cx="500" cy="560" r="10" fill="#0B192C"/>
    <line x1="500" y1="585" x2="500" y2="840" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square"/>
  </g>
</svg>