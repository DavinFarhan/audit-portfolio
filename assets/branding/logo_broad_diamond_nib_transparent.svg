<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">

    <!-- Latar Belakang -->
    <!-- Transparent Canvas -->

    <g id="broad-diamond-nib">
        <!-- TOP SECTION: DEEP NAVY FACETED PRISM -->
        <!-- Facet 1: Central Top Rhombus -->
        <polygon points="500,150 410,290 500,380 590,290" fill="#14263F" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
        
        <!-- Facet 2: Top-Left Triangle -->
        <polygon points="500,150 260,340 410,290" fill="#0B192C" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
        
        <!-- Facet 3: Top-Right Triangle -->
        <polygon points="500,150 410,290 590,290" fill="none"/>
        <polygon points="500,150 590,290 740,340" fill="#0E2038" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
        
        <!-- Facet 4: Mid-Left Outer Wing -->
        <polygon points="260,340 280,510 420,440 410,290" fill="#0B192C" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
        
        <!-- Facet 5: Mid-Right Outer Wing -->
        <polygon points="740,340 590,290 580,440 720,510" fill="#182E4E" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
        
        <!-- Facet 6: Center-Lower Triangle (Navy) -->
        <polygon points="410,290 500,380 500,470 420,440" fill="#12243C" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
        <polygon points="590,290 580,440 500,470 500,380" fill="#1E3557" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

        <!-- BOTTOM SECTION: BROAD WARM AMBER FOUNTAIN PEN NIB -->
        <!-- Left Amber Blade -->
        <path d="M 494 485 
                 L 415 452 
                 L 282 522 
                 L 494 850 
                 L 494 662 
                 A 26 26 0 0 1 494 610 
                 L 494 485 Z" 
              fill="#F59E0B" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>

        <!-- Right Amber Blade -->
        <path d="M 506 485 
                 L 506 610 
                 A 26 26 0 0 1 506 662 
                 L 506 850 
                 L 718 522 
                 L 585 452 
                 L 506 485 Z" 
              fill="#D97706" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>

        <!-- Circular Breather Hole Ring (Negative Space) -->
        <circle cx="500" cy="636" r="26" fill="#FFFFFF"/>
        
        <!-- Center Cryptographic Node (Deep Navy Single Source of Truth) -->
        <circle cx="500" cy="636" r="11" fill="#0B192C"/>
        
        <!-- Vertical Slit Line -->
        <line x1="500" y1="662" x2="500" y2="850" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square"/>
    </g>
    
</svg>