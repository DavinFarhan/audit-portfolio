<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </radialGradient>
    
    <!-- Primary Cyan to Emerald Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Warm Generosity Core Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="58%" r="30%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for crisp elevation -->
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00F2FE" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base (Circle Safe for X Avatar) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>

  <!-- Subtle Core Warmth (Murah Hati / Illuminasi) -->
  <circle cx="256" cy="300" r="140" fill="url(#centerGlow)"/>

  <!-- The Trust Shield & Covenant Loop (Single continuous stroke) -->
  <g filter="url(#crispShadow)">
    <!-- Main Outer Shield Structure -->
    <path d="M 256 90 
             C 330 90, 390 125, 390 180
             V 260
             C 390 310, 355 355, 320 375
             C 290 392, 270 415, 256 422
             C 242 415, 222 392, 192 375
             C 157 355, 122 310, 122 260
             V 180
             C 122 125, 182 90, 256 90 Z" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- The Covenant Knot / Infinity Loop (Amanah & Menepati Janji) -->
    <path d="M 175 320 
             C 140 320, 120 280, 145 250
             C 175 215, 230 270, 256 295
             C 282 270, 337 215, 367 250
             C 392 280, 372 320, 337 320
             C 300 320, 270 290, 256 275
             C 242 290, 212 320, 175 320 Z"
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Verified Keystone Center (Formal Verification / Akurasi) -->
    <circle cx="256" cy="180" r="14" fill="#00F2FE"/>
  </g>
</svg>
