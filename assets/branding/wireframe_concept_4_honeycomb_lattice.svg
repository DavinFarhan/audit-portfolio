<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="#FFFFFF"/>
  <g id="honeycomb-lattice-nib">
    <!-- TOP SECTION: HEXAGONAL HONEYCOMB LATTICE (DEEP NAVY) -->
    <!-- Outer Frame -->
    <polygon points="500,210 270,380 270,585 500,505 730,585 730,380" 
             fill="#0B192C" stroke="#FFFFFF" stroke-width="6"/>

    <!-- Honeycomb Hexagonal Cutouts (Hollow / Bolong) -->
    <!-- Center Hexagon -->
    <polygon points="500,320 545,345 545,395 500,420 455,395 455,345" fill="#FFFFFF"/>
    <circle cx="500" cy="370" r="10" fill="#0B192C"/>
    
    <!-- Top-Left Hex Cutout -->
    <polygon points="445,260 480,280 480,315 445,335 410,315 410,280" fill="#FFFFFF"/>
    <!-- Top-Right Hex Cutout -->
    <polygon points="555,260 590,280 590,315 555,335 520,315 520,280" fill="#FFFFFF"/>
    
    <!-- Mid-Left Hex Cutout -->
    <polygon points="365,345 400,365 400,405 365,425 330,405 330,365" fill="#FFFFFF"/>
    <!-- Mid-Right Hex Cutout -->
    <polygon points="635,345 670,365 670,405 635,425 600,405 600,365" fill="#FFFFFF"/>
    
    <!-- Lower-Left Hex Cutout -->
    <polygon points="410,430 445,450 445,490 410,510 375,490 375,450" fill="#FFFFFF"/>
    <!-- Lower-Right Hex Cutout -->
    <polygon points="590,430 625,450 625,490 590,510 555,490 555,450" fill="#FFFFFF"/>

    <!-- BOTTOM SECTION: SOLID WARM AMBER NIB -->
    <path d="M 500,505 L 270,585 L 500,810 L 500,651 A 26 26 0 0 1 500,599 L 500,505 Z" 
          fill="#F59E0B" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M 500,505 L 500,599 A 26 26 0 0 1 500,651 L 500,810 L 730,585 L 500,505 Z" 
          fill="#D97706" stroke="#FFFFFF" stroke-width="6"/>

    <!-- Breather Hole & Central Slit -->
    <circle cx="500" cy="625" r="26" fill="#FFFFFF"/>
    <circle cx="500" cy="625" r="11" fill="#0B192C"/>
    <line x1="500" y1="651" x2="500" y2="810" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square"/>
  </g>
</svg>