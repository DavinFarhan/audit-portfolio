<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="none"/>
  <g id="sample2-broad-executive">
    <!-- TOP SECTION: MULTI-FACETED NAVY PRISM -->
    <!-- Top Central Rhombus -->
    <polygon points="500,160 390,290 500,370 610,290" fill="#152640" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Top Outer Left Triangle -->
    <polygon points="500,160 250,390 390,290" fill="#0B192C" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Top Outer Right Triangle -->
    <polygon points="500,160 610,290 750,390" fill="#0E2038" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Lower Outer Left Wing -->
    <polygon points="250,390 265,540 400,450 390,290" fill="#081424" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Lower Outer Right Wing -->
    <polygon points="750,390 610,290 600,450 735,540" fill="#182E4E" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Central Infill Left & Right -->
    <polygon points="390,290 500,370 500,420 400,450" fill="#10223A" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    <polygon points="610,290 600,450 500,420 500,370" fill="#1D3558" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>

    <!-- BOTTOM SECTION: BROAD WARM AMBER NIB -->
    <!-- Left Blade -->
    <path d="M 495 424 
             L 261 544 
             L 495 840 
             L 495 586 
             A 26 26 0 0 1 495 534 
             L 495 424 Z" 
          fill="#F59E0B" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- Right Blade -->
    <path d="M 505 424 
             L 505 534 
             A 26 26 0 0 1 505 586 
             L 505 840 
             L 739 544 
             L 505 424 Z" 
          fill="#D97706" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- Breather Hole & Central Slit -->
    <circle cx="500" cy="560" r="26" fill="#FFFFFF"/>
    <circle cx="500" cy="560" r="11" fill="#0B192C"/>
    <line x1="500" y1="586" x2="500" y2="840" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square"/>
  </g>
</svg>