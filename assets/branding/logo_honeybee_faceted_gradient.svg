<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- ============================================== -->
    <!-- GRADIENT DEFINITIONS - THE RED GUILD AESTHETIC -->
    <!-- Multi-tonal directional polygon lighting       -->
    <!-- ============================================== -->

    <!-- Deep Navy Wings & Head Facets -->
    <linearGradient id="navyHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="navyMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <linearGradient id="navyDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0B192C"/>
    </linearGradient>

    <linearGradient id="navyShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>

    <!-- Warm Amber & Honey Gold Abdomen / Nib Facets -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="amberBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="amberMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="amberDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="amberShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for Origami Elevation -->
    <filter id="origamiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B192C" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 60% PUTIH BERSIH: Latar Belakang Lapang (Transparansi Mutlak) -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- KONTEN UTAMA: ORIGAMI FACETED CYBER-BEE NIB -->
  <g filter="url(#origamiShadow)" transform="translate(0, 0)">

    <!-- ============================================== -->
    <!-- 1. KEPALA & ANTENA LEBAH (Faceted Deep Navy)   -->
    <!-- ============================================== -->
    <!-- Antena Kiri -->
    <polygon points="242,75 210,46 220,40 248,68" fill="url(#navyMid)"/>
    <!-- Antena Kanan -->
    <polygon points="270,75 302,46 292,40 264,68" fill="url(#navyDeep)"/>

    <!-- Kepala: Faset Tengah Kiri -->
    <polygon points="256,62 256,115 228,95 236,70" fill="url(#navyMid)"/>
    <!-- Kepala: Faset Tengah Kanan -->
    <polygon points="256,62 256,115 284,95 276,70" fill="url(#navyDeep)"/>
    <!-- Kepala: Puncak Atas -->
    <polygon points="256,62 236,70 256,76" fill="url(#navyHighlight)"/>
    <polygon points="256,62 276,70 256,76" fill="url(#navyMid)"/>


    <!-- ============================================== -->
    <!-- 2. SAYAP KIRI LEBAH (Low-Poly Origami Facets) -->
    <!-- ============================================== -->
    <!-- Sayap Kiri: Faset Atas Luar (Terang / Cahaya Datang) -->
    <polygon points="228,125 105,160 175,200 220,165" fill="url(#navyHighlight)"/>
    <!-- Sayap Kiri: Faset Puncak Tengah -->
    <polygon points="228,125 175,200 236,185" fill="url(#navyMid)"/>
    <!-- Sayap Kiri: Faset Samping Luar Bawah -->
    <polygon points="105,160 145,248 175,200" fill="url(#navyDeep)"/>
    <!-- Sayap Kiri: Faset Bawah Dalam (Bayangan) -->
    <polygon points="175,200 145,248 215,235 236,185" fill="url(#navyShadow)"/>


    <!-- ============================================== -->
    <!-- 3. SAYAP KANAN LEBAH (Low-Poly Origami Facets)-->
    <!-- ============================================== -->
    <!-- Sayap Kanan: Faset Atas Luar -->
    <polygon points="284,125 407,160 337,200 292,165" fill="url(#navyMid)"/>
    <!-- Sayap Kanan: Faset Puncak Tengah -->
    <polygon points="284,125 337,200 276,185" fill="url(#navyDeep)"/>
    <!-- Sayap Kanan: Faset Samping Luar Bawah -->
    <polygon points="407,160 367,248 337,200" fill="url(#navyShadow)"/>
    <!-- Sayap Kanan: Faset Bawah Dalam -->
    <polygon points="337,200 367,248 297,235 276,185" fill="#060C14"/>


    <!-- ============================================== -->
    <!-- 4. THORAX PUSAT (Buku Tubuh Heksagon)           -->
    <!-- ============================================== -->
    <polygon points="256,115 224,142 224,178 256,198" fill="url(#navyHighlight)"/>
    <polygon points="256,115 288,142 288,178 256,198" fill="url(#navyDeep)"/>


    <!-- ============================================== -->
    <!-- 5. PERUT LEBAH BERGRADASI MADU / AMBER FASET   -->
    <!-- ============================================== -->
    <!-- Cincin Perut Atas Kiri -->
    <polygon points="256,198 214,235 256,252" fill="url(#amberGlow)"/>
    <!-- Cincin Perut Atas Kanan -->
    <polygon points="256,198 298,235 256,252" fill="url(#amberMid)"/>

    <!-- Faset Samping Perut Kiri Luar -->
    <polygon points="214,235 196,280 236,295 256,252" fill="url(#amberBright)"/>
    <!-- Faset Samping Perut Kanan Luar -->
    <polygon points="298,235 316,280 276,295 256,252" fill="url(#amberDeep)"/>

    <!-- Faset Tengah Perut Kiri (Membingkai Lubang Nafas) -->
    <polygon points="236,295 196,280 220,345 252,320" fill="url(#amberMid)"/>
    <!-- Faset Tengah Perut Kanan (Membingkai Lubang Nafas) -->
    <polygon points="276,295 316,280 292,345 260,320" fill="url(#amberShadow)"/>


    <!-- ============================================== -->
    <!-- 6. MATA PENA KALIGRAFI / SENGAT VERIFIKASI     -->
    <!-- Dilengkapi Celah Tinta & Lubang Nafas Node      -->
    <!-- ============================================== -->
    <!-- Bilah Kiri Mata Pena (Gradasi Amber Terang) -->
    <path d="M 252 320 
             L 220 345 
             L 252 475 
             L 252 385 
             A 14 14 0 0 1 252 357 
             Z" 
          fill="url(#amberBright)"/>

    <!-- Faset Sayap Kecil Kiri Ujung Pena -->
    <polygon points="220,345 238,405 252,475" fill="url(#amberGlow)"/>

    <!-- Bilah Kanan Mata Pena (Gradasi Amber Gelap / Bayangan) -->
    <path d="M 260 320 
             L 292 345 
             L 260 475 
             L 260 385 
             A 14 14 0 0 1 260 357 
             Z" 
          fill="url(#amberDeep)"/>

    <!-- Faset Sayap Kecil Kanan Ujung Pena -->
    <polygon points="292,345 274,405 260,475" fill="url(#amberShadow)"/>

    <!-- Lubang Nafas Pena (Breather Hole / Putih Bersih Transparan) -->
    <circle cx="256" cy="371" r="14" fill="#FFFFFF"/>

    <!-- Titik Node Kripto di Dalam Lubang Nafas (Single Source of Truth) -->
    <circle cx="256" cy="371" r="6" fill="#0B192C"/>

  </g>
</svg>
