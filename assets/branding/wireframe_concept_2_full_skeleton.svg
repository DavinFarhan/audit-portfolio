<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="#FFFFFF"/>
  <g id="full-wireframe-lattice">
    <!-- TOP SECTION: NAVY SKELETON LATTICE -->
    <polygon points="500,210 270,380 270,585 500,505 730,585 730,380" 
             fill="none" stroke="#0B192C" stroke-width="16" stroke-linejoin="round"/>
    
    <line x1="500" y1="210" x2="270" y2="585" stroke="#0B192C" stroke-width="14" stroke-linecap="round"/>
    <line x1="500" y1="210" x2="730" y2="585" stroke="#0B192C" stroke-width="14" stroke-linecap="round"/>
    <line x1="270" y1="380" x2="500" y2="505" stroke="#0B192C" stroke-width="14" stroke-linecap="round"/>
    <line x1="730" y1="380" x2="500" y2="505" stroke="#0B192C" stroke-width="14" stroke-linecap="round"/>
    <line x1="270" y1="380" x2="730" y2="380" stroke="#0B192C" stroke-width="14" stroke-linecap="round"/>
    <line x1="500" y1="210" x2="500" y2="505" stroke="#0B192C" stroke-width="14" stroke-linecap="round"/>

    <!-- BOTTOM SECTION: AMBER SKELETON NIB (HOLLOW) -->
    <!-- Outer Nib Contour -->
    <polygon points="270,585 500,810 730,585 500,505" 
             fill="none" stroke="#F59E0B" stroke-width="16" stroke-linejoin="round"/>
    
    <!-- Central Ink Channel Axis -->
    <line x1="500" y1="505" x2="500" y2="810" stroke="#F59E0B" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Diagonal Inner Struts -->
    <line x1="270" y1="585" x2="500" y2="650" stroke="#F59E0B" stroke-width="14" stroke-linecap="round"/>
    <line x1="730" y1="585" x2="500" y2="650" stroke="#F59E0B" stroke-width="14" stroke-linecap="round"/>

    <!-- Breather Hole Floating Ring -->
    <circle cx="500" cy="650" r="32" fill="#FFFFFF" stroke="#F59E0B" stroke-width="12"/>
    <circle cx="500" cy="650" r="14" fill="#0B192C"/>

    <!-- Outer Nodes -->
    <circle cx="500" cy="210" r="14" fill="#0B192C"/>
    <circle cx="270" cy="380" r="14" fill="#0B192C"/>
    <circle cx="730" cy="380" r="14" fill="#0B192C"/>
    <circle cx="270" cy="585" r="16" fill="#F59E0B" stroke="#0B192C" stroke-width="5"/>
    <circle cx="730" cy="585" r="16" fill="#F59E0B" stroke="#0B192C" stroke-width="5"/>
    <circle cx="500" cy="810" r="14" fill="#F59E0B"/>
    <circle cx="500" cy="380" r="16" fill="#F59E0B" stroke="#0B192C" stroke-width="6"/>
  </g>
</svg>