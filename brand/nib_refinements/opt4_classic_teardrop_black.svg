<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="#000000"/>
  <g id="opt4_classic_teardrop">
    <polygon points="500,210 730,380 730,585 500,810 270,585 270,380" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>

    
    <!-- 1. Central Top Rhombus/Spire -->
    <polygon points="500,210 364.3,431.2 500,505 635.7,431.2" 
             fill="#0B192C" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    <!-- 2. Upper Left Wing -->
    <polygon points="500,210 270,380 364.3,431.2" 
             fill="#0B192C" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    <!-- 3. Upper Right Wing -->
    <polygon points="500,210 635.7,431.2 730,380" 
             fill="#0B192C" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    <!-- 4. Lower Left Flank -->
    <polygon points="270,380 270,585 500,505 364.3,431.2" 
             fill="#0B192C" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    <!-- 5. Lower Right Flank -->
    <polygon points="730,380 635.7,431.2 500,505 730,585" 
             fill="#0B192C" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    
    
    <!-- Left Amber Blade with teardrop contour -->
    <path d="M 500,505 L 270,585 L 500,810 L 500,629 L 492,618 A 10 10 0 0 1 500,604 L 500,505 Z" 
          fill="#F59E0B" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    <!-- Right Amber Blade with teardrop contour -->
    <path d="M 500,505 L 500,604 A 10 10 0 0 1 508,618 L 500,629 L 500,810 L 730,585 L 500,505 Z" 
          fill="#E08A00" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    <!-- Teardrop Cutout (Negative Space) -->
    <path d="M 500,604 A 10 10 0 0 1 508,618 L 500,629 L 492,618 A 10 10 0 0 1 500,604 Z" fill="#FFFFFF"/>
    <!-- Mechanical Ink Slit -->
    <line x1="500" y1="629" x2="500" y2="810" stroke="#FFFFFF" stroke-width="7" stroke-linecap="square"/>
        
  </g>
</svg>