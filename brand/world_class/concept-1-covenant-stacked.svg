    <path d="M 136 170 
             C 90 240 100 340 160 396 
             C 214 446 298 446 352 396 
             C 412 340 422 240 376 170" 
          stroke="#0B1F3A" stroke-width="34"/>
    
    <!-- Welcoming Crown Loop (Murah Hati & Mempermudah) -->
