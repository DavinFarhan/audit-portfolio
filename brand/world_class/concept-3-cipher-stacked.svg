<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720">
  <g transform="translate(64, 20)">
    
  <title>Master Concept 3: The Cipher Monogram FD</title>
  <defs>
    <!-- Vector knockout for the ascending truth strike -->
    <clipPath id="fd-cut">
      <path clip-rule="evenodd" d="M-100 -100 H612 V612 H-100 Z
               M310 320 L510 120 L460 70 L260 270 Z"/>
    </clipPath>
  </defs>
  <!-- Architectural F-D Glyph -->
  <!-- Left Pillar & F Arm (Structure, Discipline, Quality) -->
  <path d="M 140 100 V 412" stroke="#0B1F3A" stroke-width="36" stroke-linecap="round"/>
  <path d="M 140 100 H 310" stroke="#0B1F3A" stroke-width="36" stroke-linecap="round"/>
  <path d="M 140 236 H 260" stroke="#0B1F3A" stroke-width="32" stroke-linecap="round"/>
  
  <!-- Sweeping D Curve (Defense, Diligence, Welcoming Embrace) -->
  <path clip-path="url(#fd-cut)"
        d="M 230 100 
           C 360 100 410 180 410 256 
           C 410 332 360 412 230 412 
           H 140" 
        fill="none" stroke="#0B1F3A" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Ascending Verification Strike (Precision Emerald Ray) -->
  <polyline points="180,290 244,354 466,132"
            fill="none" stroke="#059669" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  </g>
  <text x="320" y="595" text-anchor="middle"
        font-family="'Inter', 'Segoe UI', -apple-system, sans-serif"
        font-weight="800" font-size="82" fill="#0B1F3A" letter-spacing="2">FARHAN DAVIN</text>
  <text x="320" y="652" text-anchor="middle"
        font-family="'Inter', 'Segoe UI', -apple-system, sans-serif"
        font-weight="700" font-size="28" fill="#059669" letter-spacing="6">SMART CONTRACT AUDITOR</text>
  <rect x="250" y="675" width="140" height="4" rx="2" fill="#0B1F3A" opacity="0.25"/>
</svg>