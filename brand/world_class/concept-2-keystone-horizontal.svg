    <!-- Center node is at (256, 260) -->
    <line x1="256" y1="260" x2="86" y2="162" stroke="#0B1F3A" stroke-width="26"/>
    <line x1="256" y1="260" x2="256" y2="456" stroke="#0B1F3A" stroke-width="26"/>
    
