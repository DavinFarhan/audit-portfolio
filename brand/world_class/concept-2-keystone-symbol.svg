<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="The Prismatic Keystone">
  <title>Master Concept 2: The Prismatic Keystone</title>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Hexagonal Frame (Geometric Solidity & Amanah) -->
    <polygon points="256,64 426,162 426,358 256,456 86,358 86,162" 
             stroke="#0B1F3A" stroke-width="30"/>
    
    <!-- Internal Y-Axis Perspective (3D Cube / Crystal Refraction / Transparan) -->
    <!-- Center node is at (256, 260) -->
    <line x1="256" y1="260" x2="86" y2="162" stroke="#0B1F3A" stroke-width="26"/>
    <line x1="256" y1="260" x2="256" y2="456" stroke="#0B1F3A" stroke-width="26"/>
    
    <!-- Top-Right Dynamic Aperture & Verified Vector (Emerald Beam Breaking Outward) -->
    <polyline points="196,226 256,260 460,94" 
              stroke="#059669" stroke-width="36"/>
    
    <!-- Cryptographic Verification Core (Negative Space Locus) -->
    <circle cx="256" cy="260" r="16" fill="#FFFFFF" stroke="#059669" stroke-width="8"/>
  </g>
</svg>
