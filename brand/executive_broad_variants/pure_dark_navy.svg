<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="#0A111E"/>
  <g id="executive_broad" opacity="1.0">
    <!-- 1. Central Top Spire -->
    <polygon points="500,210 364.3,431.2 500,505 635.7,431.2" fill="#0B192C"/>
    
    <!-- 2. Upper Left Wing -->
    <polygon points="500,210 270,380 364.3,431.2" fill="#0B192C"/>
    
    <!-- 3. Upper Right Wing -->
    <polygon points="500,210 635.7,431.2 730,380" fill="#0B192C"/>
    
    <!-- 4. Lower Left Flank -->
    <polygon points="270,380 270,585 500,505 364.3,431.2" fill="#0B192C"/>
    
    <!-- 5. Lower Right Flank -->
    <polygon points="730,380 635.7,431.2 500,505 730,585" fill="#0B192C"/>

    <!-- Left Amber Blade -->
    <path d="M 500,505 L 270,585 L 500,810 L 500,651 A 26 26 0 0 1 500,599 L 500,505 Z" fill="#F59E0B"/>

    <!-- Right Amber Blade -->
    <path d="M 500,505 L 500,599 A 26 26 0 0 1 500,651 L 500,810 L 730,585 L 500,505 Z" fill="#E08A00"/>

    <!-- Internal Facet Crease Lines (Crisp White #FFFFFF, width 10px) -->
    <!-- Center Diamond Upper Edges -->
    <line x1="500" y1="210" x2="364.3" y2="431.2" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <line x1="500" y1="210" x2="635.7" y2="431.2" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Center Diamond Lower Edges -->
    <line x1="364.3" y1="431.2" x2="500" y2="505" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <line x1="635.7" y1="431.2" x2="500" y2="505" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Lateral Wing Creases -->
    <line x1="270" y1="380" x2="364.3" y2="431.2" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <line x1="730" y1="380" x2="635.7" y2="431.2" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Navy / Amber Boundary Horizon Line -->
    <line x1="270" y1="585" x2="500" y2="505" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <line x1="500" y1="505" x2="730" y2="585" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>

    <!-- Breather Hole Ring (Clean Negative Space #FFFFFF) -->
    <circle cx="500" cy="625" r="28" fill="#FFFFFF"/>
    
    <!-- Cryptographic Verification Node (Deep Navy #0B192C) -->
    <circle cx="500" cy="625" r="12" fill="#0B192C"/>

    <!-- Vertical Ink Slit (Strictly from Breather Hole to Nib Tip) -->
    <line x1="500" y1="653" x2="500" y2="810" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>